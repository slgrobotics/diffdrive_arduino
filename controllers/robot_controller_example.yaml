controller_manager:
  ros__parameters:
    update_rate: 50
    diff_controller:
      type: diff_drive_controller/DiffDriveController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_controller:
  ros__parameters:
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.3
    wheel_radius: 0.05
    publish_rate: 50.0
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_timeout: 0.5
    # Lyrical uses geometry_msgs/msg/TwistStamped on ~/cmd_vel.
    # Omitted velocity/acceleration/jerk limits use the controller's defaults.
